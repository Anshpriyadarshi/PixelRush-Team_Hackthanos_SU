<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYBE — Payment</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#07090d;
--surface:#0d1118;
--surface2:#131925;
--border:#252d3a;
--text:#f5f7fb;
--muted:#8993a5;
--primary:#8b7cff;
}

.theme-toggle{
position:absolute;
opacity:0;
}

.theme-toggle:checked~.app{
--bg:#f5f6fa;
--surface:#fff;
--surface2:#f0f2f7;
--border:#dfe3eb;
--text:#10131a;
--muted:#687181;
}

body{
font-family:Inter,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.app{
min-height:100vh;
background:var(--bg);
}

.header{
height:76px;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
padding:0 6%;
background:var(--surface);
}

.logo{
font-size:27px;
font-weight:900;
}

.right{
margin-left:auto;
display:flex;
align-items:center;
gap:15px;
}

.theme-button{
width:42px;
height:42px;
border:1px solid var(--border);
border-radius:50%;
display:grid;
place-items:center;
cursor:pointer;
background:var(--surface2);
}

.theme-button:before{content:"☾"}

.theme-toggle:checked~.app .theme-button:before{
content:"☀";
}

.container{
max-width:650px;
margin:auto;
padding:50px 20px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:32px;
}

.event-image{
height:170px;
border-radius:14px;
overflow:hidden;
margin-bottom:25px;
}

.event-image img{
width:100%;
height:100%;
object-fit:cover;
}

.summary{
background:var(--surface2);
border:1px solid var(--border);
padding:18px;
border-radius:13px;
margin:20px 0;
}

.row{
display:flex;
justify-content:space-between;
margin:9px 0;
color:var(--muted);
}

.total{
color:var(--text);
font-weight:800;
font-size:18px;
}

.method{
display:block;
border:1px solid var(--border);
border-radius:12px;
padding:15px;
margin:10px 0;
cursor:pointer;
}

input[type=radio]{
margin-right:8px;
}

label.field{
display:block;
margin-top:18px;
font-size:13px;
font-weight:700;
}

input[type=text]{
width:100%;
margin-top:8px;
padding:13px;
border:1px solid var(--border);
background:var(--surface2);
color:var(--text);
border-radius:10px;
}

.btn{
width:100%;
border:0;
padding:15px;
border-radius:11px;
background:var(--primary);
color:#fff;
font-weight:700;
margin-top:20px;
cursor:pointer;
}
</style>
</head>

<body>

<input type="checkbox" id="theme" class="theme-toggle">

<div class="app">

<header class="header">

<a href="home.html" class="logo">VYBE</a>

<div class="right">

<label for="theme" class="theme-button"></label>

<a href="registration.html">← Back</a>

</div>

</header>

<main class="container">

<div class="card">

<div class="event-image">

<img
src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80"
alt="Neon Nights">

</div>

<h1>Complete payment</h1>

<div class="summary">

<strong>Neon Nights — General Pass</strong>

<div class="row">
<span>Pass</span>
<span>₹299</span>
</div>

<div class="row">
<span>Platform fee</span>
<span>₹20</span>
</div>

<div class="row total">
<span>Total</span>
<span>₹319</span>
</div>

</div>

<form action="success.html">

<label class="method">
<input type="radio" name="method" required>
UPI
</label>

<label class="method">
<input type="radio" name="method">
Card
</label>

<label class="method">
<input type="radio" name="method">
Net Banking
</label>

<label class="field">
Payment Reference
</label>

<input
type="text"
placeholder="Enter reference ID"
required>

<button class="btn" type="submit">
Pay ₹319 →
</button>

</form>

</div>

</main>

</div>

</body>
</html>
