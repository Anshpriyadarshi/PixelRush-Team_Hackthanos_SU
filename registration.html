<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYBE — Registration</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#07090d;
--surface:#0d1118;
--surface2:#131925;
--border:#252d3a;
--text:#f5f7fb;
--muted:#8993a5;
--primary:#8b7cff;
}

.theme-toggle{
position:absolute;
opacity:0;
}

.theme-toggle:checked~.app{
--bg:#f5f6fa;
--surface:#fff;
--surface2:#f0f2f7;
--border:#dfe3eb;
--text:#10131a;
--muted:#687181;
}

body{
font-family:Inter,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.app{
min-height:100vh;
background:var(--bg);
}

.header{
height:76px;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
padding:0 6%;
background:var(--surface);
}

.logo{
font-size:27px;
font-weight:900;
}

.actions{
margin-left:auto;
display:flex;
gap:12px;
align-items:center;
}

.theme-button{
width:42px;
height:42px;
border:1px solid var(--border);
border-radius:50%;
display:grid;
place-items:center;
cursor:pointer;
background:var(--surface2);
}

.theme-button:before{content:"☾"}

.theme-toggle:checked~.app .theme-button:before{
content:"☀";
}

.container{
max-width:700px;
margin:auto;
padding:50px 25px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
padding:30px;
}

.event-preview{
height:190px;
border-radius:15px;
overflow:hidden;
margin-bottom:25px;
}

.event-preview img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
font-size:38px;
margin-bottom:8px;
}

.sub{
color:var(--muted);
margin-bottom:28px;
}

label.field{
font-size:13px;
font-weight:700;
display:block;
margin:18px 0 8px;
}

input,
select{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid var(--border);
background:var(--surface2);
color:var(--text);
}

.choice{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.choice label{
border:1px solid var(--border);
border-radius:12px;
padding:18px;
cursor:pointer;
margin:0;
}

.choice input{
width:auto;
}

.btn{
width:100%;
border:0;
border-radius:11px;
padding:15px;
background:var(--primary);
color:#fff;
font-weight:700;
margin-top:25px;
cursor:pointer;
}
</style>
</head>

<body>

<input type="checkbox" id="theme" class="theme-toggle">

<div class="app">

<header class="header">

<a href="home.html" class="logo">VYBE</a>

<div class="actions">

<label for="theme" class="theme-button"></label>

<a href="event.html">← Event</a>

</div>

</header>

<main class="container">

<div class="card">

<div class="event-preview">

<img
src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80"
alt="Neon Nights">

</div>

<h1>Reserve your pass.</h1>

<p class="sub">
Neon Nights · October 6 · Main Campus Arena
</p>

<form action="payment.html">

<label class="field">Select Pass</label>

<div class="choice">

<label>
<input type="radio" name="pass" required>
General — ₹299
</label>

<label>
<input type="radio" name="pass">
VIP — ₹599
</label>

</div>

<label class="field">Full Name</label>
<input type="text" required placeholder="Enter your name">

<label class="field">Email</label>
<input type="email" required placeholder="you@example.com">

<label class="field">Phone Number</label>
<input type="tel" required placeholder="+91 XXXXX XXXXX">

<button class="btn" type="submit">
Continue to Payment →
</button>

</form>

</div>

</main>

</div>

</body>
</html>
