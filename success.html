<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYBE — Success</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#07090d;
--surface:#0d1118;
--surface2:#131925;
--border:#252d3a;
--text:#f5f7fb;
--muted:#8993a5;
--primary:#8b7cff;
--green:#42d98b;
}

.theme-toggle{
position:absolute;
opacity:0;
}

.theme-toggle:checked~.app{
--bg:#f5f6fa;
--surface:#fff;
--surface2:#f0f2f7;
--border:#dfe3eb;
--text:#10131a;
--muted:#687181;
}

body{
font-family:Inter,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.app{
min-height:100vh;
background:var(--bg);
}

.header{
height:76px;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
padding:0 6%;
background:var(--surface);
}

.logo{
font-size:27px;
font-weight:900;
}

.right{
margin-left:auto;
display:flex;
align-items:center;
gap:15px;
}

.theme-button{
width:42px;
height:42px;
border:1px solid var(--border);
border-radius:50%;
display:grid;
place-items:center;
cursor:pointer;
background:var(--surface2);
}

.theme-button:before{content:"☾"}

.theme-toggle:checked~.app .theme-button:before{
content:"☀";
}

.container{
max-width:700px;
margin:auto;
padding:55px 20px;
text-align:center;
}

.check{
width:80px;
height:80px;
border-radius:50%;
background:#143e2c;
color:var(--green);
display:grid;
place-items:center;
font-size:38px;
margin:0 auto 25px;
}

h1{
font-size:42px;
}

.sub{
color:var(--muted);
margin:10px 0 30px;
}

.pass{
background:var(--surface);
border:1px solid var(--border);
border-radius:22px;
padding:30px;
text-align:left;
}

.pass-image{
height:170px;
border-radius:14px;
overflow:hidden;
margin-bottom:20px;
}

.pass-image img{
width:100%;
height:100%;
object-fit:cover;
}

.pass-head{
display:flex;
justify-content:space-between;
border-bottom:1px solid var(--border);
padding-bottom:20px;
}

.qr{
width:170px;
height:170px;
margin:25px auto;
background:
linear-gradient(90deg,#111 10px,transparent 10px) 0 0/30px 30px,
linear-gradient(#111 10px,transparent 10px) 0 0/30px 30px,
#fff;
border:12px solid white;
}

.btns{
display:flex;
gap:10px;
}

.btn{
flex:1;
padding:14px;
border-radius:11px;
text-align:center;
background:var(--primary);
color:white;
font-weight:700;
}

.btn.secondary{
background:var(--surface2);
color:var(--text);
border:1px solid var(--border);
}

@media(max-width:600px){
.btns{flex-direction:column}
}
</style>
</head>

<body>

<input type="checkbox" id="theme" class="theme-toggle">

<div class="app">

<header class="header">

<a href="home.html" class="logo">VYBE</a>

<div class="right">
<label for="theme" class="theme-button"></label>
</div>

</header>

<main class="container">

<div class="check">✓</div>

<h1>You're in.</h1>

<p class="sub">
Your Neon Nights pass has been confirmed.
</p>

<div class="pass">

<div class="pass-image">

<img
src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=1200&q=80"
alt="Concert">

</div>

<div class="pass-head">

<div>
<strong>NEON NIGHTS</strong>
<p>General Pass</p>
</div>

<strong>VYBE</strong>

</div>

<div class="qr"></div>

<p>
<strong>October 6, 2026</strong>
</p>

<p style="color:var(--muted)">
7:00 PM · Main Campus Arena
</p>

<div class="btns">

<a href="calendar.html" class="btn">
Add to Calendar
</a>

<a href="my-events.html" class="btn secondary">
My Events
</a>

</div>

</div>

</main>

</div>

</body>
</html>
